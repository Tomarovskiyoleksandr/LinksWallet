<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="./css/auth.css">
</head>
<body>

    <main class="auth-page">
        <section class="auth-card">
            <a class="auth-logo" href="/">LinksWallet</a>

            <div class="auth-head">
                <h1>Регистрация</h1>
                <p>Создайте аккаунт, чтобы хранить ссылки по доскам и быстро находить нужное.</p>
            </div>

            <form id="registerForm" class="auth-form">
                <label>
                    <span>Имя пользователя</span>
                    <input type="text" name="username" id="username" placeholder="Ваше имя" minlength="3" maxlength="30" autocomplete="username" required>
                </label>

                <label>
                    <span>Email</span>
                    <input type="email" name="email" id="email" placeholder="you@example.com" maxlength="255" autocomplete="email" required>
                </label>

                <label>
                    <span>Пароль</span>
                    <input type="password" name="password" id="password" placeholder="Придумайте пароль" minlength="8" maxlength="128" autocomplete="new-password" required>
                </label>

                <p class="auth-message" id="authMessage"></p>

                <button type="submit">Создать аккаунт</button>
            </form>

            <p class="auth-switch">
                Уже есть аккаунт?
                <a href="/login">Войти</a>
            </p>
        </section>
    </main>

    <script src="./js/register.js"></script>

</body>
</html>
