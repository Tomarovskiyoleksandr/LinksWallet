<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Мои ссылки — LinksWallet</title><link rel="stylesheet" href="/css/index.css"><script src="/js/profile.js" defer></script><link rel="stylesheet" href="/css/design.css"></head>
<body class="app-page">
<aside class="sidebar"><a href="/" class="brand"><img src="/img/about/link.svg" alt="">LinksWallet</a><nav aria-label="Главное меню"><button class="nav-item active" id="linksNav"><img src="/img/about/link.svg" alt="">Мои ссылки</button><button class="nav-item" id="foldersNav"><img src="/img/about/folder.svg" alt="">Папки</button><button class="nav-item" id="profileNav"><img src="/img/about/user.svg" alt="">Профиль</button></nav><nav class="secondary-nav" aria-label="О сервисе"><a class="nav-item" href="/about"><img src="/img/about/shield-check.svg" alt="">О проекте</a><a class="nav-item" href="/privacy"><img src="/img/about/bookmark.svg" alt="">Конфиденциальность</a><button class="nav-item" id="themeToggle"><img src="/img/about/moon.svg" alt=""><span>Тёмная тема</span></button><button class="nav-item logout" id="logoutButton" hidden><img src="/img/about/log-out.svg" alt="">Выйти</button><a class="nav-item" id="loginLink" href="/login">Войти</a></nav></aside>
<main class="workspace" id="main"><div class="user-bar"><span>Привет, <span id="greeting">гость</span> 👋</span><button class="icon-button" id="profileButton" aria-label="Профиль"><img src="/img/about/user.svg" alt=""></button></div><header class="workspace-header"><div><h1>Мои ссылки</h1><p>Ваши находки, идеи и полезные места в интернете.</p></div><div class="toolbar"><label class="search"><img src="/img/about/search.svg" alt=""><input type="search" id="search" placeholder="Поиск в папке…" aria-label="Поиск в выбранной папке"></label><button class="primary" id="addLink" disabled><img src="/img/about/plus.svg" alt="">Добавить ссылку</button></div></header><p class="notice" id="notice" role="status" hidden></p><div class="content-grid"><section class="panel folders-panel" id="foldersPanel" tabindex="-1" aria-labelledby="foldersTitle"><div class="panel-heading"><h2 id="foldersTitle">Мои папки</h2><button class="icon-button" id="addBoard" title="Создать папку" aria-label="Создать папку" disabled><img src="/img/about/plus.svg" alt=""></button></div><div class="boards-list" id="boardsList"><p class="placeholder">Загрузка…</p></div></section><section class="panel links-panel" aria-labelledby="boardTitle"><div class="panel-heading links-heading"><div><h2 id="boardTitle">Ваши ссылки</h2><p id="linkCount" aria-live="polite"></p></div><div class="board-tools" id="boardTools" hidden><button class="icon-button" id="editBoard" title="Переименовать папку" aria-label="Переименовать папку"><img src="/img/about/pencil.svg" alt=""></button><button class="icon-button" id="deleteBoard" title="Удалить папку" aria-label="Удалить папку"><img src="/img/about/trash-2.svg" alt=""></button></div></div><div class="links-list" id="linksList"><p class="placeholder">Загрузка…</p></div></section></div><section id="profileView" class="profile-view" aria-labelledby="profileTitle" hidden>
    <header class="profile-heading"><h1 id="profileTitle" tabindex="-1">Профиль</h1><p>Информация о вашем аккаунте.</p></header>
    <section class="profile-summary" aria-label="Ваш профиль"><div class="profile-avatar" id="profileAvatar" aria-hidden="true"></div><div class="profile-identity"><h2 id="profileName"></h2><p id="profileEmail"></p></div><button class="secondary profile-edit" id="editName"><img src="/img/about/pencil.svg" alt="">Изменить имя</button></section>
    <section class="account-panel" aria-labelledby="accountTitle"><h2 id="accountTitle">Аккаунт</h2><dl class="account-details"><div><dt>Имя пользователя</dt><dd id="accountName"></dd></div><div><dt>Email</dt><dd id="accountEmail"></dd></div><div><dt>Дата регистрации</dt><dd id="accountDate"></dd></div></dl></section>
</section></main>
<dialog id="editor" aria-labelledby="dialogTitle"><form id="editorForm"><div class="dialog-header"><h2 id="dialogTitle"></h2><button type="button" id="closeDialog" class="icon-button" aria-label="Закрыть">×</button></div><div id="dialogFields"></div><p id="dialogError" role="alert" class="form-error"></p><div class="dialog-actions"><button type="button" class="secondary" id="cancelDialog">Отмена</button><button class="primary" id="saveDialog" type="submit">Сохранить</button></div></form></dialog>
</body></html>
